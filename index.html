<title>פראג 🇨🇿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bg1:#0b0d17;--text:#eceaf4;--muted:#8e94ad;
  --glass:rgba(255,255,255,.06);--glass-b:rgba(255,255,255,.11);--glass-strong:rgba(20,24,44,.82);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --gold:#e8bd5b;--gold2:#f3d27f;--blue:#6b95ff;--green:#3ddc97;--red:#ff5c85;--orange:#ffb04a;
  --input:rgba(0,0,0,.28);--hdr-bg:rgba(11,13,23,.84);
}
@media(prefers-color-scheme:light){:root{
  --bg1:#f4f1ea;--text:#1b1b22;--muted:#6c7086;
  --glass:rgba(255,255,255,.72);--glass-b:rgba(255,255,255,.95);--glass-strong:rgba(255,255,255,.9);
  --shadow:0 10px 28px rgba(60,50,90,.13);
  --gold:#b98514;--gold2:#d9a53a;--blue:#3b6ae0;--green:#14a06a;--red:#d93060;--orange:#d68a12;
  --input:rgba(0,0,0,.05);--hdr-bg:rgba(244,241,234,.88);
}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{
  font-family:'Inter','Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:var(--text);direction:rtl;min-height:100vh;
  background:
    radial-gradient(900px 500px at 100% -10%,rgba(107,149,255,.20),transparent 60%),
    radial-gradient(800px 500px at -10% 15%,rgba(232,189,91,.15),transparent 55%),
    var(--bg1);
  background-attachment:fixed;
}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow)}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--sat);background:var(--hdr-bg);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--glass-b)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:6px}
.hbtn-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.hbtn-row::-webkit-scrollbar{display:none}
.hdr h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:800;letter-spacing:-.2px;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live{color:var(--green)}.sync.live .dot{background:var(--green);animation:pulse 1.8s infinite}
.sync.busy{color:var(--blue)}.sync.busy .dot{background:transparent;border:2px solid var(--blue);border-top-color:transparent;animation:spin .7s linear infinite}
.days{display:flex;gap:8px;padding:6px 14px 12px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-c{flex-shrink:0;padding:8px 16px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--glass);border:1px solid var(--glass-b);cursor:pointer;white-space:nowrap;transition:all .25s}
.day-c.on{color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;box-shadow:0 6px 18px rgba(232,189,91,.35);transform:translateY(-1px)}

/* main */
.main{padding:150px 14px calc(96px + var(--sab));max-width:640px;margin:0 auto}

/* progress + chips */
.prog{border-radius:20px;padding:14px 16px;margin-bottom:12px}
.prog-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:10px}
.prog-top span:last-child{color:var(--gold);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--input);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{font-size:12px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b)}

/* cards */
.card{position:relative;border-radius:22px;padding:14px 16px 14px;margin-bottom:10px;cursor:pointer;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow);transition:transform .18s ease,opacity .4s ease,box-shadow .3s ease,filter .4s ease}
.card:active{transform:scale(.983)}
.card.hi{border-color:rgba(232,189,91,.45);box-shadow:var(--shadow),0 0 0 1px rgba(232,189,91,.15) inset}
.card.done{opacity:.5;filter:saturate(.6)}
.card.done .title{text-decoration:line-through;text-decoration-thickness:2px}
.enter .card,.enter .seg{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),10)*35ms)}
.card.remote,.remote{animation:remote 1.4s ease}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:46px;margin-bottom:6px}
.time{font-size:12.5px;font-weight:700;color:var(--blue)}
.cost{font-size:11.5px;font-weight:700;color:var(--gold);background:rgba(232,189,91,.14);padding:3px 10px;border-radius:999px}
.cost.free{color:var(--green);background:rgba(61,220,151,.14)}
.title{font-size:15.5px;font-weight:700;line-height:1.4;margin-bottom:3px}
.desc{font-size:12.5px;color:var(--muted);line-height:1.5}
.alert{font-size:12px;font-weight:600;color:var(--orange);margin-top:6px}
.book-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--red);background:rgba(255,92,133,.13);padding:3px 10px;border-radius:999px;margin-top:7px}
.chk{position:absolute;top:10px;left:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:transparent;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,color .2s;z-index:2}
.chk.on{background:var(--green);border-color:var(--green);color:#0b1a12}
.chk.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.5)}
.note-dot{font-size:11.5px;font-weight:700;color:var(--blue);background:rgba(107,149,255,.14);padding:3px 10px;border-radius:999px;transition:color .3s}
.note-dot.has{color:var(--blue);font-weight:700}
.note-dot.flash{animation:nflash .8s ease}

/* transport segments */
.seg{margin:0 22px 10px;padding:10px 14px;border-radius:16px;font-size:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--glass-b);background:var(--glass)}
.seg-icon{font-size:20px}.seg-info{flex:1;min-width:0}
.seg-method{font-weight:700;margin-bottom:1px}.seg-detail{color:var(--muted);font-size:11.5px}
.seg-walk{background:rgba(61,220,151,.09);border-color:rgba(61,220,151,.25)}.seg-walk .seg-method{color:var(--green)}
.seg-taxi{background:rgba(255,176,74,.09);border-color:rgba(255,176,74,.28)}.seg-taxi .seg-method{color:var(--orange)}
.seg-metro{background:rgba(107,149,255,.09);border-color:rgba(107,149,255,.28)}.seg-metro .seg-method{color:var(--blue)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.gold{color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 16px rgba(232,189,91,.3)}
.btn.ghost{color:var(--text);background:var(--glass);border:1px solid var(--glass-b)}
.btn.block{width:100%;margin-top:12px}
.btn.sm{min-height:38px;padding:0 14px;font-size:12px}

/* bookings */
.bk-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bk-when{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);background:rgba(107,149,255,.14);padding:3px 10px;border-radius:999px;margin-bottom:6px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.bk-hint{font-size:13px;color:var(--muted);margin-top:10px}
.card.bk{padding-bottom:16px}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--glass-b);background:var(--input);color:var(--text);font-family:inherit;font-size:16px}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(107,149,255,.2)}
.add-card{width:100%;min-height:64px;border-radius:22px;border:2px dashed var(--glass-b);background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px}
.add-card:active{transform:scale(.98);border-color:var(--gold);color:var(--gold)}
.btn.danger{color:var(--red);background:rgba(255,92,133,.12);border:1px solid rgba(255,92,133,.25)}

.seg2{display:flex;gap:6px;padding:5px;border-radius:18px;margin-bottom:12px}
.seg2 button{flex:1;padding:10px 6px;border:none;border-radius:14px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s}
.seg2 button.on{color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 16px rgba(232,189,91,.3)}
.weather{padding:12px 16px;border-radius:18px;font-size:13px;line-height:1.55;margin-bottom:12px}
.card.pk{display:flex;align-items:center;gap:12px;padding:9px 14px 9px 8px;margin-bottom:8px;border-radius:18px}
.card.pk .chk{position:static;flex-shrink:0}
.pk-main{flex:1;min-width:0}
.card.pk .title{margin:0;font-size:14.5px;font-weight:600;line-height:1.45}
.who{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:rgba(107,149,255,.14);padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:middle}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;font-size:16px;cursor:pointer;flex-shrink:0;opacity:.7}
.sec-h{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--glass-b)}
.link-btn{display:block;margin:6px auto 0;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:10px}
.namebar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;padding:0 4px}

.ppl{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b)}
.pchip.me{border-color:rgba(232,189,91,.55)}
.pchip b{color:var(--gold)}
.pchip.sm{font-size:10.5px;padding:2px 8px;opacity:.7}
.pchip.sm.on{opacity:1;color:#0b1a12;background:var(--green);border-color:transparent}
.pk-people{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.live-badge{max-width:82vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 12px}
.who-btn{min-height:64px;font-size:17px}

.who-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 6px}
.whosw{display:flex;gap:8px;margin-bottom:12px}
.whobtn{flex:1;min-height:58px;border-radius:18px;border:1.5px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .25s}
.whobtn .wn{font-size:15px;font-weight:800}
.whobtn .ws{font-size:11.5px;color:var(--muted);font-weight:700}
.whobtn:active{transform:scale(.96)}
.whobtn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#141414;box-shadow:0 8px 20px rgba(232,189,91,.38);transform:translateY(-1px)}
.whobtn.active .ws{color:rgba(20,20,20,.7)}
.whobtn.add{flex:0 0 52px}
.whobtn.add .wn{font-size:20px;color:var(--muted)}

.idsw{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);flex-shrink:0;margin:0 8px}
.idbtn{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .25s}
.idbtn:active{transform:scale(.94)}
.idbtn.active{color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 3px 10px rgba(232,189,91,.4)}
#syncTxt{display:none}
@media(min-width:430px){#syncTxt{display:inline}}

.hbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
.hbtn:active{transform:scale(.92)}
.hbtn.sos{color:var(--red);border-color:rgba(255,92,133,.35)}
.hbtn .ic{width:19px;height:19px}
.sync{margin-inline-start:8px}
.hdr-sub{display:flex;align-items:center;gap:8px;padding:2px 14px 10px}
.hdr-sub .days{padding:0;flex:1;min-width:0}
.hdr-sub .idsw{margin:0}
.ic{width:20px;height:20px;flex-shrink:0}
.btn .ic{width:16px;height:16px}
.tab .ic{width:22px;height:22px;transition:transform .25s}
.tab.on .ic{transform:translateY(-1px) scale(1.1)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags .book-tag{margin-top:0}
.cat{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.cat-transport{color:var(--blue);background:rgba(107,149,255,.15)}
.cat-food{color:var(--orange);background:rgba(255,176,74,.16)}
.cat-hotel{color:#a78bfa;background:rgba(167,139,250,.17)}
.cat-attraction{color:var(--green);background:rgba(61,220,151,.15)}
.conv{display:flex;align-items:center;gap:10px;border-radius:20px;padding:10px 12px;margin-bottom:12px}
.conv-in{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--input);border-radius:14px;padding:0 12px}
.conv-in .cur{font-size:12px;font-weight:800;color:var(--gold)}
.conv-in input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:16px;height:42px;direction:ltr;text-align:left}
.conv-out{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted);min-width:70px}
.conv-out b{color:var(--text);font-size:14px}
.wx-card{border-radius:20px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.wx-ic{font-size:36px;line-height:1;flex-shrink:0}
.wx-main{flex:1;min-width:0}
.wx-title{font-size:13.5px;font-weight:800}
.wx-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.wx-stats{display:flex;gap:12px;margin-top:7px;flex-wrap:wrap}
.wx-stat{font-size:12.5px;font-weight:700;color:var(--text)}
.wx-stat b{color:var(--gold)}
.wx-hourly{display:flex;gap:11px;overflow-x:auto;margin-top:10px;padding-top:10px;border-top:1px solid var(--glass-b);scrollbar-width:none}
.wx-hourly::-webkit-scrollbar{display:none}
.wx-hr{flex-shrink:0;text-align:center;min-width:40px}
.wx-hr-t{font-size:10.5px;color:var(--muted);font-weight:700}
.wx-hr-ic{font-size:17px;margin:3px 0}
.wx-hr-v{font-size:12px;font-weight:800}
.wx-hr-p{font-size:9.5px;color:var(--blue);font-weight:700;margin-top:1px}
.tools-row{display:flex;gap:8px;margin-bottom:12px}
.day-map{width:100%;height:56vh;border-radius:16px;overflow:hidden;margin-top:6px;background:var(--input)}
.map-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.map-legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.mk{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-popup-content{background:var(--glass-strong)!important;color:var(--text)!important;border-radius:12px!important;padding:8px 13px!important;font-family:inherit!important;font-size:12.5px!important;line-height:1.5!important;box-shadow:0 6px 20px rgba(0,0,0,.35)!important;direction:rtl!important}
.maplibregl-popup-tip{display:none!important}
.mk-pop-t{opacity:.65;font-size:11.5px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tool-btn.on{color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
.tool-btn .ic{width:16px;height:16px}
.seg{flex-wrap:wrap}
.seg-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.drag-h{position:absolute;top:9px;left:10px;width:36px;height:36px;border-radius:11px;background:var(--input);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:2}
.sortable-ghost{opacity:.35}
.ordering .card{cursor:default}
.sheet-sec{font-size:12px;font-weight:800;color:var(--muted);margin:18px 0 8px}
.hotel-card{border-radius:20px;padding:14px 16px;background:var(--glass);border:1px solid var(--glass-b)}
.hotel-card .hn{font-size:17px;font-weight:800}
.hotel-card .ha{font-size:14px;margin-top:4px;direction:ltr;text-align:left;unicode-bidi:plaintext}
.hotel-card .he{font-size:12.5px;color:var(--muted);margin-top:2px;direction:ltr;text-align:left}
.info-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--glass-b)}
.info-row:last-of-type{border-bottom:none}
.info-main{flex:1;min-width:0}
.info-t{font-size:13.5px;font-weight:700;line-height:1.4}
.info-v{font-size:13.5px;color:var(--gold);font-weight:700;direction:ltr;text-align:right;unicode-bidi:plaintext}
.info-empty{color:var(--orange);font-weight:600;direction:rtl;font-size:12.5px}
.driver-box{background:#0b0b0f;color:#fff;border-radius:22px;padding:26px 20px;text-align:center}
.driver-box .dz{font-size:15px;color:#b9bdd0;margin-bottom:14px}
.driver-box .dn{font-size:26px;font-weight:800;line-height:1.25}
.driver-box .da{font-size:22px;font-weight:700;margin-top:10px;line-height:1.35}
.driver-box .de{font-size:15px;color:#b9bdd0;margin-top:12px}

@supports(height:1dvh){.modal{max-height:86dvh}}
.mo{overscroll-behavior:contain}
body.sheet-open{overflow:hidden}
.sheet-x{position:sticky;top:0;display:flex;width:36px;height:36px;margin:-4px auto -32px 0;z-index:3;align-items:center;justify-content:center;border-radius:50%;border:none;background:var(--input);color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
.tags:empty{display:none}
.prog-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.cost-line{font-size:12px;color:var(--muted);font-weight:600}
.prog-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.exp-sum{border-radius:20px;padding:16px;margin-bottom:12px;text-align:center}
.exp-sum .big{font-size:30px;font-weight:800;color:var(--gold);line-height:1.1}
.exp-sum .conv2{font-size:13px;color:var(--muted);margin-top:4px}
.exp-days{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.exp-days::-webkit-scrollbar{display:none}
.exp-daychip{flex-shrink:0;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--input);color:var(--text);white-space:nowrap;border:1.5px solid transparent;font-family:inherit;cursor:pointer}
.exp-daychip.on{border-color:var(--gold);color:var(--gold)}
.exp-daychip:not(button){cursor:default}
.exp-daychip b{color:var(--gold)}
.exp-g{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 4px 8px;display:flex;justify-content:space-between}
.exp-g span:last-child{color:var(--gold)}
.exp-row{display:flex;align-items:center;gap:10px;border-radius:18px;padding:11px 14px;margin-bottom:8px}
.exp-row .amt{font-size:16px;font-weight:800;color:var(--gold);min-width:78px}
.exp-row .em{flex:1;min-width:0}
.exp-row .et{font-size:13.5px;font-weight:600}
.es{font-size:11px;color:var(--muted);margin-top:2px}
.catpick{display:flex;flex-wrap:wrap;gap:7px}
.catpick button{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:12px;border:1.5px solid var(--glass-b);background:var(--glass);color:var(--text);font-family:inherit;cursor:pointer}
.catpick button.on{border-color:transparent;color:#141414;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.paypick{display:flex;flex-wrap:wrap;gap:7px}
.paypick button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid var(--glass-b);background:var(--glass);color:var(--text);font-family:inherit;cursor:pointer}
.paypick button.on{border-color:transparent;color:#141414;background:linear-gradient(135deg,var(--blue),#8aa8ff)}

/* tab bar */
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(10px + var(--sab));z-index:25;display:flex;padding:6px;border-radius:24px;max-width:520px;margin:0 auto;
  background:var(--glass-strong)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:none;background:none;color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;border-radius:18px;transition:all .25s}
.tab .ti{font-size:20px;transition:transform .25s}
.tab.on{color:var(--gold);background:var(--glass)}
.tab.on .ti{transform:translateY(-1px) scale(1.1)}
.badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center}
.badge.show{display:flex}

/* modal */
.mo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex;animation:fade .2s ease}
.modal{position:relative;overscroll-behavior:contain;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:14px 18px calc(20px + var(--sab));

function hav(a1,o1,a2,o2){const R=6371,d1=(a2-a1)*Math.PI/180,d2=(o2-o1)*Math.PI/180,a=Math.sin(d1/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function getTransport(from,to,dist){

  if(dist<=0.02) return null;
  if(dist<=1.2) return{m:'🚶 הליכה',t:'walk',min:Math.round(dist/0.075),why:`${dist<1?(dist*1000).toFixed(0)+' מטר':dist.toFixed(1)+' ק"מ'}`};

  return{m:'🚕 מונית (Bolt)',t:'taxi',min:Math.round(dist/0.5),why:`${dist.toFixed(1)} ק"מ – קחו מונית`};
}

/* ══════════ Embedded day-route map (OpenFreeMap + MapLibre, no API key) ══════════ */
const CATCOL={transport:'#6b95ff',food:'#ffb04a',hotel:'#a78bfa',attraction:'#3ddc97'};
let dayMapInst=null,dayMapPopup=null;
function dayMapPoints(){return acts(curDay).filter(function(a){return a.la>49.5&&a.la<50.5&&a.ln>14&&a.ln<15})}
function openDayRoute(){
  const list=dayMapPoints();
  if(list.length<2){toast('אין מספיק נקודות ליום הזה למסלול');return}
  openSheet(`<div class="modal"><div class="handle"></div><h2>🗺️ מסלול היום</h2><div class="sub">${esc(D[curDay].l)} · ${esc(D[curDay].d)} · לחצו על נקודה למעבר אליה</div>

    <button class="btn gold block" onclick="openDayRouteExternal()">🧭 נווט במסלול המלא ב-Google Maps</button></div>`);
  setTimeout(initDayMap,60);
}
function initDayMap(){
  const el=document.getElementById('dayMap');
  if(!el)return;
  if(!window.maplibregl){el.innerHTML='<div class="bk-hint" style="padding:20px;text-align:center">המפה לא נטענה — בדקו חיבור לאינטרנט</div>';return}
  if(dayMapInst){try{dayMapInst.remove()}catch(e){}dayMapInst=null}
  dayMapPopup=null;
  const list=dayMapPoints();
  let map;
  try{
    map=new maplibregl.Map({container:el,style:'https://tiles.openfreemap.org/styles/positron',center:[list[0].ln,list[0].la],zoom:13,attributionControl:false});
  }catch(e){console.log('map-init-err',e);el.innerHTML='<div class="bk-hint" style="padding:20px;text-align:center">לא הצלחנו לטעון את המפה</div>';return}
  dayMapInst=map;
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
  map.on('load',function(){
    const lines=[];
    for(let i=1;i<list.length;i++){
      const p=list[i-1],a=list[i],tr=getTransport(p,a,hav(p.la,p.ln,a.la,a.ln)),mode=tr?tr.t:'walk';
      lines.push({type:'Feature',properties:{mode:mode},geometry:{type:'LineString',coordinates:[[p.ln,p.la],[a.ln,a.la]]}});
    }
    map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:lines}});
    // line-dasharray can't be a per-feature (data-driven) expression in MapLibre — only a fixed value per layer.
    // So walk/taxi/metro each get their own filtered layer instead of one layer with a dynamic dasharray.
    map.addLayer({id:'route-walk',type:'line',source:'route',filter:['==',['get','mode'],'walk'],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#3ddc97','line-width':4}});
    map.addLayer({id:'route-taxi',type:'line',source:'route',filter:['==',['get','mode'],'taxi'],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffb04a','line-width':4,'line-dasharray':[2,2]}});
    map.addLayer({id:'route-metro',type:'line',source:'route',filter:['==',['get','mode'],'metro'],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#6b95ff','line-width':4,'line-dasharray':[2,2]}});
    const bounds=new maplibregl.LngLatBounds();
    // Spread out markers that share (almost) the same coordinates — otherwise later
    // pins are drawn directly on top of earlier ones and hide them completely.
    const seen=[];
    function jitter(la,ln){
      let n=0;
      for(let k=0;k<seen.length;k++){
        if(Math.abs(seen[k][0]-la)<0.0003&&Math.abs(seen[k][1]-ln)<0.0003)n++;
      }
      seen.push([la,ln]);
      if(n===0)return[la,ln];
      const ang=n*2.4, r=0.00022*n;
      return[la+Math.sin(ang)*r, ln+Math.cos(ang)*r];
    }
    function showMkPopup(a,pos){
      if(dayMapPopup){dayMapPopup.remove()}
      dayMapPopup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:18})
        .setLngLat(pos)
        .setHTML('<b>'+esc(a.ic+' '+a.n)+'</b><br><span class="mk-pop-t">'+esc(a.s+'–'+a.e)+'</span>')
        .addTo(map);
    }
    function goToCard(a){
      closeSheet();
      setTimeout(function(){
        const card=document.querySelector('[data-id="'+a.id+'"]');
        if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.remove('remote');void card.offsetWidth;card.classList.add('remote')}
      },350); // let the sheet's close animation/layout settle first, or scrollIntoView can land in the wrong place
    }
    list.forEach(function(a,i){
      const cat=catOf(a),col=CATCOL[cat?cat.k:'attraction'];
      const pos=jitter(a.la,a.ln);
      const mk=document.createElement('div');
      mk.className='mk';mk.style.background=col;mk.textContent=String(i+1);
      mk.addEventListener('mouseenter',function(){showMkPopup(a,pos)});
      mk.addEventListener('mouseleave',function(){if(dayMapPopup){dayMapPopup.remove();dayMapPopup=null}});
      let tapTimer=null;
      mk.addEventListener('click',function(){
        if(tapTimer){ // second tap within the window -> navigate to it in the app
          clearTimeout(tapTimer);tapTimer=null;
          goToCard(a);
        }else{ // first tap -> just show what this place is
          showMkPopup(a,pos);
          tapTimer=setTimeout(function(){tapTimer=null},320);
        }
      });
      new maplibregl.Marker({element:mk}).setLngLat([pos[1],pos[0]]).addTo(map);
      bounds.extend([pos[1],pos[0]]);
    });
    map.fitBounds(bounds,{padding:48,maxZoom:16});
  });
}

/* ══════════ Whole-day route in Google Maps (numbered stops, in order) ══════════ */
function openDayRouteExternal(){
  const list=dayMapPoints();
  if(list.length<2){toast('אין מספיק נקודות ליום הזה למסלול');return}
  const pts=list.slice(0,25); // Google's directions API caps at 25 total stops
  const origin=destStr(pts[0]),destination=destStr(pts[pts.length-1]);
  const waypoints=pts.slice(1,-1).map(destStr).join('|');
  let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode=walking';
  if(waypoints)url+='&waypoints='+encodeURIComponent(waypoints);
  window.open(url,'_blank');
}

function allBookings(){

    return{id:b.id,ic:o.icon||b.ic,t:o.title||b.t,when:(o.when_text!=null?o.when_text:b.when),kind:o.kind||b.kind,v:(o.value!=null?o.value:b.v),
      custom:true,created_by:o.created_by,created_dev:o.created_dev,updated_by:o.updated_by,updated_dev:o.updated_dev,_edited:true};

}

let sortSettled={},sortTimers={};
function settledDone(id){return(id in sortSettled)?sortSettled[id]:!!done[id]}
function toggleDone(id,ev){
  if(ev)ev.stopPropagation();
  const willBeDone=!done[id];
  if(sortTimers[id]){clearTimeout(sortTimers[id]);delete sortTimers[id]}
  if(willBeDone){
    sortSettled[id]=false; // checked instantly, but wait a few seconds before it jumps down — room to undo
    sortTimers[id]=setTimeout(function(){sortSettled[id]=true;delete sortTimers[id];renderView()},5000);
  }else{
    sortSettled[id]=false; // unchecking is instant
  }
  return toggleKey(id,id);
}
async function toggleKey(id,pop){
  const nv=!done[id];
  if(nv)done[id]=true;else delete done[id];
  saveLocal();
  pending[id]=(pending[id]||0)+1;
  renderView({pop:pop});
  if(!sb){pending[id]--;if(pending[id]<=0)delete pending[id];return}
  try{
    const r=await tracked(sb.from('checks').upsert(Object.assign({item_id:id,is_completed:nv,updated_at:new Date().toISOString()},stamp())));
    if(r.error)throw r.error;
  }catch(e){
    console.log('check-err',e);
    if(nv)delete done[id];else done[id]=true;
    saveLocal();
    toast('לא נשמר: '+(e.message||'שגיאה'));
  }finally{
    pending[id]--;if(pending[id]<=0)delete pending[id];
    renderView();
  }
}

function applyChecks(rows){
  const nd={};
  rows.forEach(r=>{if(r.is_completed)nd[r.item_id]=true});
  Object.keys(pending).forEach(k=>{if(done[k])nd[k]=true;else delete nd[k]});
  if(myName)nd['person:'+myName]=true;
  const changed=[];
  new Set(Object.keys(nd).concat(Object.keys(done))).forEach(k=>{
    if(!!nd[k]!==!!done[k]){if(k.indexOf('person:')===0)peopleDirty=true;else changed.push(k)}
  });
  done=nd;saveLocal();
  return changed;
}
function describeChange(keys){
  for(let n=0;n<keys.length;n++){
    const k=keys[n];
    if(k.indexOf('pk:')===0&&done[k]){
      const rest=k.slice(3),i=rest.indexOf(':');
      if(i>0){const it=packing.find(x=>x.id===rest.slice(0,i));return '✅ '+rest.slice(i+1)+' ארז/ה'+(it?': '+it.title:'')}
    }
  }
  return '✅ עודכן אצל משתמש אחר';
}

function applyBookings(rows){
  let nr=rows.filter(r=>!pendingDel[r.id]).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  Object.keys(pendingAdd).forEach(id=>{if(!nr.some(r=>r.id===id))nr.push(pendingAdd[id])});
  const added=nr.filter(r=>!custom.some(c=>c.id===r.id)).map(r=>r.id);
  const diff=JSON.stringify(nr)!==JSON.stringify(custom);
  custom=nr;
  try{localStorage.setItem('p_custom',JSON.stringify(custom))}catch(e){}
  return{diff,added};
}
async function loadAll(){
  if(!sb)return;
  if(loading){again=true;return}
  loading=true;
  try{
    const res=await tracked(Promise.all([sb.from('notes').select('*'),sb.from('checks').select('*'),sb.from('bookings').select('*'),sb.from('packing').select('*'),sb.from('info').select('*'),sb.from('plan_order').select('*'),sb.from('expenses').select('*'),sb.from('plan_items').select('*')]));
    const rn=res[0],rc=res[1],rb=res[2],rp=res[3],ri=res[4],ro=res[5],rx=res[6],rpi=res[7];
    let cc=[],nr={changed:[],diff:false},br={diff:false,added:[]},pr={diff:false,added:[]},ir={diff:false},oo={diff:false},xx={diff:false,added:[]},pii={diff:false};
    if(rn.error)console.log('notes-load-err',rn.error);else nr=applyNotes(rn.data);
    if(rc.error)console.log('checks-load-err',rc.error);else cc=applyChecks(rc.data);
    if(rb.error)console.log('bookings-load-err',rb.error);else br=applyBookings(rb.data);
    if(rp.error)console.log('packing-load-err',rp.error);
    else if(rp.data.length===0&&!seedTried){
      seedTried=true;
      packing=SEED_ROWS.map(r=>Object.assign({created_at:new Date().toISOString()},r));
      try{localStorage.setItem('p_packing',JSON.stringify(packing))}catch(e){}
      try{const sr=await sb.from('packing').upsert(SEED_ROWS,{onConflict:'id',ignoreDuplicates:true});if(sr.error)console.log('seed-err',sr.error)}catch(e){console.log('seed-err',e)}
      pr={diff:true,added:[]};
    }
    else pr=applyPacking(rp.data);
    if(ri.error)console.log('info-load-err',ri.error);
    else if(ri.data.length===0&&!infoSeedTried){
      infoSeedTried=true;
      infoRows=INFO_ROWS.map(r=>Object.assign({created_at:new Date().toISOString()},r));
      try{localStorage.setItem('p_info',JSON.stringify(infoRows))}catch(e){}
      try{const sr=await sb.from('info').upsert(INFO_ROWS,{onConflict:'id',ignoreDuplicates:true});if(sr.error)console.log('info-seed-err',sr.error)}catch(e){console.log('info-seed-err',e)}
      ir={diff:true};
    }
    else ir=applyInfo(ri.data);
    if(ro.error)console.log('order-load-err',ro.error);else oo=applyOrder(ro.data);
    if(rx.error)console.log('expenses-load-err',rx.error);else xx=applyExpenses(rx.data);
    if(rpi.error)console.log('plan-items-load-err',rpi.error);else pii=applyPlanItems(rpi.data);
    if((rc.error||rb.error||rp.error||ri.error||ro.error||rx.error||rpi.error)&&!firstLoadDone)toast('חסרה טבלה ב-Supabase — הריצו את ה-SQL');
    const first=!firstLoadDone;
    firstLoadDone=true;synced=true;
    if(first||cc.length||nr.diff||br.diff||pr.diff||ir.diff||oo.diff||xx.diff||pii.diff||peopleDirty){peopleDirty=false;renderView({changed:first?[]:cc.concat(br.added),notes:first?[]:nr.changed})}
    if(ir.diff&&$('mo').classList.contains('on')&&$('sos-root'))showSOS();
    if(!first){
      if(cc.length)showLive(describeChange(cc));
      else if(br.added.length)showLive('➕ נוספה הזמנה חדשה');
      else if(pr.added.length)showLive('🧳 נוסף פריט לרשימת האריזה');
      else if(xx.added.length)showLive('💰 נוספה הוצאה חדשה');
      else if(pii.diff)showLive('🗓️ הלו"ז עודכן');
      else if(nr.changed.length)showLive('💬 הערה חדשה!');
    }
  }catch(e){
    console.log('load-err',e);
  }finally{
    loading=false;
    if(again){again=false;loadAll()}
  }
}

async function saveBooking(id){

async function delBooking(id,ev){
  if(ev)ev.stopPropagation();
  if(!confirm('למחוק את הפריט אצל כולם?'))return;
  closeSheet();
  if(!sb){toast('אין חיבור לשרת');return}
  const isSeed=BOOKINGS.some(function(b){return b.id===id});
  const old=custom.slice(),wasDone=done[id];
  try{
    if(isSeed){
      const row=Object.assign({id:id,deleted:true},stampNew());
      pendingAdd[id]=row;
      custom=custom.some(c=>c.id===id)?custom.map(c=>c.id===id?row:c):custom.concat([row]);
      renderView();
      const r=await tracked(sb.from('bookings').upsert(row));
      if(r.error)throw r.error;
      delete pendingAdd[id];
    }else{
      pendingDel[id]=1;custom=custom.filter(c=>c.id!==id);delete done[id];saveLocal();renderView();
      const r=await tracked(sb.from('bookings').delete().eq('id',id));
      if(r.error)throw r.error;
      await tracked(sb.from('checks').delete().eq('item_id',id));
      delete pendingDel[id];
    }
    toast('נמחק');
  }catch(e){
    console.log('del-err',e);
    custom=old;if(wasDone)done[id]=true;saveLocal();
    delete pendingAdd[id];delete pendingDel[id];
    renderView();
    toast('לא נמחק: '+(e.message||'שגיאה'));
  }
}

const EXP_CATS=['🍽️ אוכל ומסעדות','🚕 תחבורה','🎟️ כרטיסים ואטרקציות','🛍️ קניות','☕ קפה וחטיפים','🏨 מלון','📦 אחר'];
function applyPlanItems(rows){
  const nr=rows.filter(r=>planPend[r.id]!==null).map(r=>planPend[r.id]||r);
  Object.keys(planPend).forEach(id=>{if(planPend[id]&&!nr.some(r=>r.id===id))nr.push(planPend[id])});
  const diff=JSON.stringify(nr)!==JSON.stringify(planCustom);
  planCustom=nr;
  try{localStorage.setItem('p_plan_items',JSON.stringify(planCustom))}catch(e){}
  return{diff};
}
function applyExpenses(rows){
  const nr=rows.filter(r=>expPend[r.id]!==null).map(r=>expPend[r.id]||r);
  Object.keys(expPend).forEach(id=>{if(expPend[id]&&!nr.some(r=>r.id===id))nr.push(expPend[id])});
  const added=nr.filter(r=>!expenses.some(c=>c.id===r.id)).map(r=>r.id);
  const diff=JSON.stringify(nr)!==JSON.stringify(expenses);
  expenses=nr;
  try{localStorage.setItem('p_expenses',JSON.stringify(expenses))}catch(e){}
  return{diff,added};
}
const CUR_SYM={CZK:'CZK',ILS:'₪',USD:'$',EUR:'€'};
const CUR_LIST=['CZK','ILS','USD','EUR'];
function expSorted(){return expenses.slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')))}
function expCur(r){return r.currency||'CZK'}
function expToCZK(r){
  const amt=+r.amount||0,c=expCur(r),rt=curRates();
  if(c==='CZK')return amt;
  if(c==='ILS')return amt/rt.ils;
  if(c==='EUR')return amt/rt.eur;
  if(c==='USD')return amt/rt.usd;
  return amt;
}
function expTotal(list){return list.reduce((s,r)=>s+expToCZK(r),0)}
function expTotalNative(list,cur){return list.filter(r=>expCur(r)===cur).reduce((s,r)=>s+(+r.amount||0),0)}

  const dayChip=(key,label)=>{
    const items=key==='none'?list.filter(x=>x.day_idx==null||x.day_idx===''):list.filter(x=>x.day_idx===key);

    return `<button class="exp-daychip${expDayFilter===String(key)?' on':''}" data-exp-filter="${key}">${esc(label)} · <b>${fmt(t,0)}</b></button>`;

    <div class="exp-days">${curChips}</div></div>`;
  let filtered=expDayFilter===''?list:expDayFilter==='none'?list.filter(x=>x.day_idx==null||x.day_idx===''):list.filter(x=>x.day_idx===+expDayFilter);
  if(expCurFilter!=='')filtered=filtered.filter(x=>expCur(x)===expCurFilter);
  const activeFilters=[];
  if(expDayFilter!=='')activeFilters.push(expDayFilter==='none'?'כללי':(D[+expDayFilter]?D[+expDayFilter].l:''));
  if(expCurFilter!=='')activeFilters.push(CUR_SYM[expCurFilter]);
  if(activeFilters.length){
    h+=`<div class="exp-g"><span>מציג: ${esc(activeFilters.join(' · '))}</span><button class="link-btn" style="margin:0;padding:2px 8px" onclick="clearExpFilters()">✕ נקה סינון</button></div>`;
    if(expCurFilter!==''){
      h+=`<div class="exp-g"><span>סה"כ ב-${CUR_SYM[expCurFilter]}</span><span>${fmt(expTotalNative(filtered,expCurFilter),2)} ${CUR_SYM[expCurFilter]}</span></div>`;
    }
  }
  const groups=D.map((d,i)=>({key:i,label:d.l,items:filtered.filter(x=>x.day_idx===i)})).concat([{key:'',label:'כללי',items:filtered.filter(x=>x.day_idx==null||x.day_idx==='')}]).filter(g=>g.items.length);
  if(!groups.length)h+=`<div class="bk-hint" style="text-align:center;padding:22px">אין עדיין הוצאות ${activeFilters.length?'כאלה':'רשומות'}</div>`;
  groups.forEach(g=>{
    h+=`<div class="exp-g"><span>${esc(g.label)}</span><span>${fmt(expTotal(g.items),0)} CZK</span></div>`;
    g.items.forEach(r=>{
      const payLbl=r.paid_by==='🤝 משותף'?'שולם במשותף':r.paid_by?'שילם/ה '+esc(r.paid_by):'';

async function savePlanItem(){
  const n=$('pa-n').value.trim();
  if(!n){toast('צריך שם לפעילות');return}
  const addr=$('pa-addr').value.trim();
  if(!planEditId&&!addr){toast('מקום / כתובת הוא שדה חובה');return}
  if(!sb){toast('אין חיבור לשרת');return}
  const s=$('pa-s').value.trim(),e=$('pa-e').value.trim(),ic=$('pa-ic').value.trim()||'📍',ds=$('pa-ds').value.trim(),c=$('pa-c').value.trim();
  const id=planEditId||('pa'+Date.now());
  const existing=planEditId?planCustom.find(function(x){return x.id===planEditId}):null;
  const btn=$('pa-save');btn.disabled=true;btn.textContent='שומר...';
  const row=planEditId
    ? Object.assign({id:id,day_idx:planEditDay,time_start:s||null,time_end:e||null,icon:ic,title:n,desc:ds||null,cost_text:c||null,addr:addr||null,deleted:false,created_by:existing?existing.created_by:null,created_dev:existing?existing.created_dev:null},stamp())
    : Object.assign({id:id,day_idx:planEditDay,time_start:s||null,time_end:e||null,icon:ic,title:n,desc:ds||null,cost_text:c||null,addr:addr||null,deleted:false},stampNew());
  const before=planCustom.slice();
  planPend[id]=row;
  planCustom=planCustom.some(x=>x.id===id)?planCustom.map(x=>x.id===id?row:x):planCustom.concat([row]);
  renderView();
  try{
    const r=await tracked(sb.from('plan_items').upsert(row));
    if(r.error)throw r.error;
    closeSheet();toast('נשמר ✓');
  }catch(e){
    console.log('plan-save-err',e);planCustom=before;renderView();
    toast('לא נשמר: '+(e.message||'שגיאה'));
    btn.disabled=false;btn.textContent='שמור';
  }finally{delete planPend[id]}
}
async function delPlanItem(di,id){
  if(!confirm('למחוק את הפעילות הזו אצל כולם?'))return;
  if(!sb){toast('אין חיבור לשרת');return}
  const isSeed=D[di].a.some(function(x){return x.id===id});
  const before=planCustom.slice();
  closeSheet();
  try{
    if(isSeed){
      // can't truly delete a seeded row — store a tombstone override instead
      const row=Object.assign({id:id,day_idx:di,deleted:true},stampNew());
      planPend[id]=row;
      planCustom=planCustom.some(x=>x.id===id)?planCustom.map(x=>x.id===id?row:x):planCustom.concat([row]);
      renderView();
      const r=await tracked(sb.from('plan_items').upsert(row));
      if(r.error)throw r.error;
    }else{
      planPend[id]=null;
      planCustom=planCustom.filter(function(x){return x.id!==id});
      renderView();
      const r=await tracked(sb.from('plan_items').delete().eq('id',id));
      if(r.error)throw r.error;
    }
    toast('נמחק');
  }catch(e){
    console.log('plan-del-err',e);planCustom=before;renderView();
    toast('לא נמחק: '+(e.message||'שגיאה'));
  }finally{delete planPend[id]}
}

async function saveExpense(){
  const amt=num($('ex-a').value);
  if(!(amt>0)){toast('הזינו סכום תקין');return}
  if(!sb){toast('אין חיבור לשרת');return}
  const note=$('ex-n').value.trim(),before=expenses.slice();
  const dayIdx=expDaySel===''?null:+expDaySel;
  let row;
  if(expEditId){const old=expenses.find(x=>x.id===expEditId);row=Object.assign({},old,{amount:amt,currency:expCurSel,category:expCatSel,note:note||null,paid_by:expPaySel||null,day_idx:dayIdx},stamp())}
  else{row=Object.assign({id:'x'+Date.now(),amount:amt,currency:expCurSel,category:expCatSel,note:note||null,paid_by:expPaySel||null,day_idx:dayIdx,created_at:new Date().toISOString()},stampNew())}
  const btn=$('ex-save');btn.disabled=true;btn.textContent='שומר...';
  expPend[row.id]=row;
  expenses=expenses.some(x=>x.id===row.id)?expenses.map(x=>x.id===row.id?row:x):expenses.concat([row]);
  renderView();
  try{
    const r=await tracked(sb.from('expenses').upsert(row));
    if(r.error)throw r.error;
    closeSheet();toast('נשמר ✓');
  }catch(e){
    console.log('exp-save-err',e);expenses=before;renderView();
    toast('לא נשמר: '+(e.message||'שגיאה'));
    btn.disabled=false;btn.textContent='שמור';
  }finally{delete expPend[row.id]}
}
async function delExpense(){
  const id=expEditId;if(!id)return;
  if(!confirm('למחוק את ההוצאה הזו אצל כולם?'))return;
  const before=expenses.slice();
  expPend[id]=null;expenses=expenses.filter(x=>x.id!==id);
  closeSheet();renderView();
  try{const r=await tracked(sb.from('expenses').delete().eq('id',id));if(r.error)throw r.error;toast('נמחק')}
  catch(e){console.log('exp-del-err',e);expenses=before;renderView();toast('לא נמחק: '+(e.message||'שגיאה'))}
  finally{delete expPend[id]}
}

function nameMatch(a,b){a=String(a).trim().toLowerCase();b=String(b).trim().toLowerCase();return !!a&&!!b&&(a.includes(b)||b.includes(a))}
function mine(it){return !it.who||!myName||nameMatch(it.who,myName)}

function packDone(it){return !!done[packKey(it)]}
function packSorted(items){return items.slice().sort((a,b)=>(a.sort||0)-(b.sort||0)||String(a.created_at||'').localeCompare(String(b.created_at||'')))}

function people(){
  const list=PEOPLE.slice(),extra=[];

  Object.keys(done).forEach(k=>{if(k.indexOf('person:')===0&&done[k])add(k.slice(7))});
  add(myName);

let packSortDone={},packSortTimers={};
function packSortVal(it){
  const k=packKey(it);
  return(k in packSortDone)?packSortDone[k]:packDone(it);
}
function togglePack(id){
  const it=packing.find(x=>x.id===id);if(!it)return;
  if(it.list==='personal'&&!ensureName()){toast('צריך שם כדי לסמן פריטים אישיים');return}
  const k=packKey(it),willBeDone=!packDone(it);
  if(packSortTimers[k]){clearTimeout(packSortTimers[k]);delete packSortTimers[k]}
  if(willBeDone){
    // check the box instantly, but wait a few seconds before it jumps to the bottom —
    // gives a moment to tap again if it was a mistake
    packSortDone[k]=false;
    packSortTimers[k]=setTimeout(function(){packSortDone[k]=true;delete packSortTimers[k];renderView()},5000);
  }else{
    packSortDone[k]=false; // unchecking is instant, no grace period needed
  }
  toggleKey(k,'pk:'+id);
}
function applyPacking(rows){
  const nr=rows.filter(r=>pkPend[r.id]!==null).map(r=>pkPend[r.id]||r);
  Object.keys(pkPend).forEach(id=>{if(pkPend[id]&&!nr.some(r=>r.id===id))nr.push(pkPend[id])});
  const added=nr.filter(r=>!packing.some(c=>c.id===r.id)).map(r=>r.id);
  const diff=JSON.stringify(nr)!==JSON.stringify(packing);
  packing=nr;
  try{localStorage.setItem('p_packing',JSON.stringify(packing))}catch(e){}
  return{diff,added};
}

async function savePack(){
  const t=$('pk-t').value.trim();
  if(!t){toast('צריך לכתוב שם');return}
  if(!sb){toast('אין חיבור לשרת');return}
  const c=$('pk-c').value.trim()||'שונות',w=$('pk-w').value.trim();
  const before=packing.slice();
  let row;
  if(pkEditId){
    const old=packing.find(x=>x.id===pkEditId);
    row=Object.assign({},old,{title:t,category:c,who:w||null,list:pkListSel},stamp());
  }else{
    const mx=packing.reduce((m,x)=>Math.max(m,x.sort||0),0);
    row=Object.assign({id:'k'+Date.now(),list:pkListSel,category:c,title:t,who:w||null,sort:mx+1,created_at:new Date().toISOString()},stampNew());
  }
  const btn=$('pk-save');btn.disabled=true;btn.textContent='שומר...';
  pkPend[row.id]=row;
  packing=packing.some(x=>x.id===row.id)?packing.map(x=>x.id===row.id?row:x):packing.concat([row]);
  renderView();
  try{
    const r=await tracked(sb.from('packing').upsert(row));
    if(r.error)throw r.error;
    closeSheet();toast('נשמר ✓');
  }catch(e){
    console.log('pack-save-err',e);
    packing=before;renderView();
    toast('לא נשמר: '+(e.message||'שגיאה'));
    btn.disabled=false;btn.textContent='שמור';
  }finally{delete pkPend[row.id]}
}
async function delPack(){
  const id=pkEditId;if(!id)return;
  if(!confirm('למחוק את הפריט אצל כולם?'))return;
  const before=packing.slice();
  pkPend[id]=null;packing=packing.filter(x=>x.id!==id);
  closeSheet();renderView();
  try{
    const r=await tracked(sb.from('packing').delete().eq('id',id));
    if(r.error)throw r.error;
    try{await sb.from('checks').delete().eq('item_id','pk:'+id);await sb.from('checks').delete().like('item_id','pk:'+id+':%')}catch(e){}
    toast('נמחק');
  }catch(e){
    console.log('pack-del-err',e);
    packing=before;toast('לא נמחק: '+(e.message||'שגיאה'));
  }finally{delete pkPend[id];renderView()}
}

const WX_DATES=['2026-10-23','2026-10-24','2026-10-25','2026-10-26','2026-10-27'];
const WX_ICONS={0:['☀️','שמיים בהירים'],1:['🌤️','בהיר בעיקר'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],48:['🌫️','ערפל קופא'],51:['🌦️','טפטוף קל'],53:['🌦️','טפטוף'],55:['🌧️','טפטוף חזק'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם חזק'],71:['🌨️','שלג קל'],73:['🌨️','שלג'],75:['❄️','שלג כבד'],80:['🌦️','ממטרים'],81:['🌧️','ממטרים'],82:['⛈️','ממטרים עזים'],95:['⛈️','סופת רעמים']};
function wxInfo(code){return WX_ICONS[code]||['🌡️','מזג אוויר']}
function isoDate(d){return d.toISOString().slice(0,10)}
async function fetchWeather(force){
  if(!force){
    let last=0;try{last=+localStorage.getItem('p_wx_at')||0}catch(e){}
    if(Date.now()-last<24*60*60*1000)return; // already fetched today, skip the request
  }
  try{
    const start=isoDate(new Date());
    const end=isoDate(new Date(Date.now()+15*24*60*60*1000)); // Open-Meteo's free daily forecast covers ~16 days
    const url='https://api.open-meteo.com/v1/forecast?latitude=50.0875&longitude=14.4213&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Europe%2FPrague&start_date='+start+'&end_date='+end;
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;
    const t=setTimeout(()=>{if(ctl)ctl.abort()},6000);
    const r=await fetch(url,ctl?{signal:ctl.signal}:{});clearTimeout(t);
    const j=await r.json();
    if(j&&j.daily&&j.daily.time){
      const map={};
      j.daily.time.forEach((dt,i)=>{map[dt]={code:j.daily.weathercode[i],tmax:j.daily.temperature_2m_max[i],tmin:j.daily.temperature_2m_min[i],pop:j.daily.precipitation_probability_max[i]}});
      let hourly=[];
      if(j.hourly&&j.hourly.time){
        hourly=j.hourly.time.map((t,i)=>({time:t,temp:j.hourly.temperature_2m[i],pop:j.hourly.precipitation_probability[i],code:j.hourly.weathercode[i]}));
      }
      weather={map:map,today:start,hourly:hourly};
      try{localStorage.setItem('p_wx',JSON.stringify(weather));localStorage.setItem('p_wx_at',String(Date.now()))}catch(e){}
      if(tab==='plan')renderView();
    }
  }catch(e){console.log('wx-err',e)}
}
function wxStatsRow(wx){
  return`<div class="wx-stats"><span class="wx-stat">🔺 <b>${Math.round(wx.tmax)}°</b></span><span class="wx-stat">🔻 <b>${Math.round(wx.tmin)}°</b></span><span class="wx-stat">☔ <b>${Math.round(wx.pop==null?0:wx.pop)}%</b></span></div>`;
}
function wxHourlyStrip(){
  if(!weather||!weather.hourly||!weather.hourly.length||!weather.today)return'';
  const todays=weather.hourly.filter(function(h){return h.time.indexOf(weather.today)===0});
  if(!todays.length)return'';
  const nowH=new Date().getHours();
  let startIdx=todays.findIndex(function(h){return +h.time.slice(11,13)>=nowH});
  if(startIdx<0)startIdx=0;
  const next=todays.slice(startIdx,startIdx+6);
  if(!next.length)return'';
  return`<div class="wx-hourly">${next.map(function(h){
    const hh=h.time.slice(11,16),info=wxInfo(h.code),showRain=h.pop!=null&&h.pop>=20;
    return`<div class="wx-hr"><div class="wx-hr-t">${hh}</div><div class="wx-hr-ic">${info[0]}</div><div class="wx-hr-v">${Math.round(h.temp)}°</div>${showRain?`<div class="wx-hr-p">☔${Math.round(h.pop)}%</div>`:''}</div>`;
  }).join('')}</div>`;
}
function wxCard(di){
  const map=weather&&weather.map;
  const dt=WX_DATES[di],wx=map&&map[dt];
  if(wx){
    const info=wxInfo(wx.code);
    return`<div class="wx-card glass"><div class="wx-ic">${info[0]}</div><div class="wx-main">

  }

  // so the card visibly updates day to day and confirms the feature is actually working.
  const todayWx=map&&weather.today&&map[weather.today];
  if(todayWx){
    const info=wxInfo(todayWx.code);
    return`<div class="wx-card glass"><div class="wx-ic">${info[0]}</div><div class="wx-main">

    </div></div>`;
  }
  return`<div class="wx-card glass"><div class="wx-ic">🌡️</div><div class="wx-main"><div class="wx-title">טוען תחזית...</div><div class="wx-sub">${esc(D[di].d)}</div></div></div>`;
}

  finally{delete infoPend[id]}
}

/* ══════════ Taxi deep links ══════════ */
function uberLink(a){
  const nm=encodeURIComponent(ADDR[a.id]||a.n);
  return 'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Blatitude%5D='+a.la+'&dropoff%5Blongitude%5D='+a.ln+'&dropoff%5Bnickname%5D='+nm+'&dropoff%5Bformatted_address%5D='+nm;
}
function findAct(id){for(let i=0;i<D.length;i++){const a=D[i].a.find(x=>x.id===id);if(a)return a}return null}
function boltCopy(id){
  const a=findAct(id);if(!a)return;
  copyText(ADDR[a.id]||(a.la+','+a.ln));
  toast('📋 הכתובת הועתקה — פתחו את Bolt והדביקו כיעד');
}

/* ══════════ Reorder activities (drag & drop, shared) ══════════ */
let orderMode=false,planOrder={},orderPend={},dragging=false,pendingRender=false,sortInst=null;
try{planOrder=JSON.parse(localStorage.getItem('p_order')||'{}')}catch(e){planOrder={}}
function acts(di){
  const seedMap={};D[di].a.forEach(function(a){seedMap[a.id]=a});
  const overrides={},added=[];
  planCustom.forEach(function(r){
    if(r.day_idx!==di)return;
    if(seedMap[r.id])overrides[r.id]=r;else added.push(r);
  });
  let list=D[di].a.map(function(a){
    const o=overrides[a.id];
    if(!o)return a;
    if(o.deleted)return null;
    return Object.assign({},a,{
      s:o.time_start||a.s,e:o.time_end||a.e,ic:o.icon||a.ic,n:o.title||a.n,
      ds:(o.desc!=null?o.desc:a.ds),c:o.cost_text||a.c,cv:(o.cost_val!=null?o.cost_val:a.cv),
      addr:o.addr||a.addr,
      la:(isFinite(o.lat)?o.lat:a.la),ln:(isFinite(o.lng)?o.lng:a.ln),
      created_by:o.created_by,created_dev:o.created_dev,updated_by:o.updated_by,updated_dev:o.updated_dev,
      _edited:true
    });
  }).filter(Boolean);
  added.forEach(function(r){
    list.push({id:r.id,s:r.time_start||'',e:r.time_end||'',ic:r.icon||'📍',n:r.title,ds:r.desc||'',
      c:r.cost_text||'—',cv:r.cost_val||0,la:(isFinite(r.lat)?r.lat:NaN),ln:(isFinite(r.lng)?r.lng:NaN),addr:r.addr||'',custom:true,
      created_by:r.created_by,created_dev:r.created_dev,updated_by:r.updated_by,updated_dev:r.updated_dev});
  });
  const ord=planOrder['d'+di];
  if(ord&&ord.length){
    const by={};list.forEach(a=>{by[a.id]=a});
    const out=[];
    ord.forEach(function(id){if(by[id]){out.push(by[id]);delete by[id]}});
    list.forEach(function(a){if(by[a.id])out.push(a)});
    list=out;
  }
  return list;
}
function allActsAcrossDays(){
  const out=[];
  D.forEach(function(d,di){acts(di).forEach(function(a){out.push(Object.assign({dayIdx:di},a))})});
  return out;
}
function toggleOrder(){orderMode=!orderMode;renderView({force:true})}
function applyOrder(rows){
  const nm={};
  rows.forEach(r=>{if(Array.isArray(r.ids))nm[r.day_key]=r.ids});
  Object.keys(orderPend).forEach(k=>{if(orderPend[k]===null)delete nm[k];else nm[k]=orderPend[k]});
  const diff=JSON.stringify(nm)!==JSON.stringify(planOrder);
  planOrder=nm;try{localStorage.setItem('p_order',JSON.stringify(planOrder))}catch(e){}
  return{diff};
}
async function savePlanOrder(di,ids){
  const key='d'+di;
  planOrder[key]=ids;orderPend[key]=ids;
  try{localStorage.setItem('p_order',JSON.stringify(planOrder))}catch(e){}
  renderView({force:true});
  if(!sb){delete orderPend[key];return}
  try{const r=await tracked(sb.from('plan_order').upsert(Object.assign({day_key:key,ids:ids,updated_at:new Date().toISOString()},stamp())));if(r.error)throw r.error;toast('הסדר נשמר ✓')}
  catch(e){console.log('order-err',e);toast('לא נשמר: '+(e.message||'שגיאה'))}
  finally{delete orderPend[key]}
}
async function resetOrder(){
  if(!confirm('בטוח שרוצים לאפס את הסדר ולחזור למקורי?'))return;
  const key='d'+curDay;
  delete planOrder[key];orderPend[key]=null;
  try{localStorage.setItem('p_order',JSON.stringify(planOrder))}catch(e){}
  renderView({force:true});
  if(!sb){delete orderPend[key];return}
  try{const r=await tracked(sb.from('plan_order').delete().eq('day_key',key));if(r.error)throw r.error;toast('הסדר אופס')}
  catch(e){console.log('order-reset-err',e);toast('לא אופס: '+(e.message||'שגיאה'))}
  finally{delete orderPend[key]}
}
function initSortable(){
  if(sortInst){try{sortInst.destroy()}catch(e){}sortInst=null}
  const el=$('actList');
  if(!orderMode||tab!=='plan'||!el||!window.Sortable)return;
  sortInst=window.Sortable.create(el,{animation:180,handle:'.drag-h',draggable:'.card',ghostClass:'sortable-ghost',delay:60,delayOnTouchOnly:true,
    onStart:()=>{dragging=true},
    onEnd:()=>{
      dragging=false;
      const ids=Array.prototype.map.call(el.querySelectorAll('.card[data-id]'),x=>x.getAttribute('data-id'));
      savePlanOrder(curDay,ids);
    }});
}

/* ══════════ Sheets: open / close (X button, swipe, back button, Esc) ══════════ */
function openMo(){
  const mo=$('mo');mo.classList.add('on');
  const m=mo.querySelector('.modal');
  if(m&&!m.querySelector('.sheet-x')){
    const b=document.createElement('button');b.className='sheet-x';b.setAttribute('data-close','1');b.setAttribute('aria-label','סגור');b.textContent='✕';
    m.insertBefore(b,m.firstChild);
  }
  document.body.classList.add('sheet-open');
  try{if(!(history.state&&history.state.sheet))history.pushState({sheet:1},'')}catch(e){}
}
function closeSheet(fromPop){
  const mo=$('mo');
  if(!mo.classList.contains('on'))return;
  mo.classList.remove('on');
  document.body.classList.remove('sheet-open');
  if(dayMapInst){try{dayMapInst.remove()}catch(e){}dayMapInst=null}
  dayMapPopup=null;
  try{if(fromPop!==true&&history.state&&history.state.sheet)history.back()}catch(e){}
  if(pendingUpdate)setTimeout(doReload,300);
}
window.addEventListener('popstate',()=>{if($('mo').classList.contains('on'))closeSheet(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let sw=null;
document.addEventListener('touchstart',e=>{const h=e.target.closest&&e.target.closest('.handle');if(!h)return;const m=h.closest('.modal');if(!m)return;sw={y:e.touches[0].clientY,m:m};m.style.transition='none'},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dy=e.touches[0].clientY-sw.y;if(dy>0)sw.m.style.transform='translateY('+dy+'px)'},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw)return;
  const m=sw.m,dy=e.changedTouches[0].clientY-sw.y;sw=null;
  m.style.transition='transform .2s';m.style.transform='';
  if(dy>90)closeSheet();
});

/* ══════════ Taxi sheet ══════════ */
function showTaxi(id){
  const a=findAct(id);if(!a)return;
  const addr=ADDR[a.id]||a.n;
  openSheet(`<div class="modal"><div class="handle"></div><h2>🚕 הזמנת מונית</h2><div class="sub">יעד: ${esc(a.n)}</div>
    <div class="hotel-card"><div class="he" style="margin:0;color:var(--text)">${esc(addr)}</div></div>
    <div class="bk-actions" style="margin-top:12px"><a class="btn gold" href="${uberLink(a)}" target="_blank" rel="noopener">Uber — היעד מוזן</a><button class="btn ghost" data-bolt="${a.id}">Bolt — העתק כתובת</button></div>
    <div class="bk-hint">ל-Bolt אין קישור שמזין יעד לבד. מעתיקים את הכתובת, פותחים את Bolt ומדביקים.</div></div>`);
}

/* ══════════ Detail modal ══════════ */
function showDetail(di,ai){
  const d=D[di],list=acts(di),a=list[ai],mo=$('mo');
  let nextHtml='';
  if(ai<list.length-1){
    const next=list[ai+1],dist=hav(a.la,a.ln,next.la,next.ln),tr=getTransport(a,next,dist);
    if(tr){
      const mode=tr.t==='walk'?'walk':tr.t==='taxi'?'taxi':'metro';
      nextHtml=`<span class="note-label">הבא: ${next.ic} ${next.n}</span>
        <div class="row"><span class="ic">${tr.t==='walk'?'🚶':tr.t==='taxi'?'🚕':'🚇'}</span><span>${tr.m} · ~${tr.min} דק' · ${tr.why}</span></div>
        <a class="btn gold block" href="${gmapsDirTo(a.la,a.ln,next,mode)}" target="_blank" rel="noopener">🧭 נווט לנקודה הבאה</a>${tr.t==='taxi'?`<button class="btn ghost block" data-taxi="${next.id}">🚕 הזמן מונית</button>`:''}`;
    }else if(destStr(next)){
      nextHtml=`<span class="note-label">הבא: ${next.ic} ${next.n}</span>
        <div class="row"><span class="ic">📍</span><span>מרחק לא ידוע — בדקו בעצמכם</span></div>
        <a class="btn gold block" href="${gmapsDirTo(a.la,a.ln,next,'walk')}" target="_blank" rel="noopener">🧭 נווט לנקודה הבאה</a>`;
    }
  }
  const has=notes[a.id]&&notes[a.id].text;
  mo.innerHTML=`<div class="modal"><div class="handle"></div>
    <h2>${a.ic} ${a.n}</h2><div class="sub">${a.s}–${a.e} · ${d.l}</div>
    ${(a.custom||a._edited)&&traceLbl(a)?`<div class="es">${traceLbl(a)}</div>`:''}
    ${a.ds?`<div class="row"><span class="ic">📝</span><span>${a.ds}</span></div>`:''}
    <div class="row"><span class="ic">💰</span><span class="lb">עלות</span><span>${a.c}</span></div>
    ${a.al?`<div class="row"><span class="ic">⚠️</span><span style="color:var(--orange);font-weight:600">${a.al}</span></div>`:''}
    ${a.bk?`<div class="row"><span class="ic">📋</span><span style="color:var(--red);font-weight:600">דרוש הזמנה מראש</span></div>`:''}
    <a class="btn ghost block" href="${gmapsSearchFor(a)}" target="_blank" rel="noopener">📍 הצג במפה</a>
    <div class="bk-actions" style="margin-top:8px"><button class="btn ghost" onclick="showPlanEdit(${di},'${a.id}')">✏️ ערוך</button><button class="btn danger" onclick="delPlanItem(${di},'${a.id}')">🗑️ מחק</button></div>
    ${nextHtml}
    <span class="note-label">💬 הערות (משותף לכולם)</span>
    <textarea class="note-area" id="note-ta-${a.id}" placeholder="הוסיפו הערה לפעילות הזאת...">${has?esc(notes[a.id].text):''}</textarea>
    <div class="note-auth" id="note-auth-${a.id}"></div>
    <button class="btn gold block" id="note-btn-${a.id}" onclick="saveNote('${a.id}')">שמור הערה</button>
  </div>`;
  openMo();
  mo.onclick=e=>{if(e.target===mo)closeSheet()};
  showAuthorLine(a.id);
}

/* ══════════ Update check — אוטומטי לגמרי, בלי APP_VERSION ידני ══════════ */
/* משווה hash של תוכן ה-HTML שהשרת מחזיר לזה שנטען בפעם האחרונה. */
/* אם שונה ואין חלון עריכה פתוח — מרענן לבד. אם יש עריכה פתוחה — מחכה שתיסגר כדי לא לאבד הקלדה. */
let lastHtmlHash=null,pendingUpdate=false;
function simpleHash(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0}return h}
async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    const html=await r.text();
    const h=simpleHash(html);
    if(lastHtmlHash===null){lastHtmlHash=h;return}
    if(h!==lastHtmlHash){
      pendingUpdate=true;
      if($('mo').classList.contains('on'))showUpdateBanner();
      else doReload();
    }
  }catch(e){console.log('update-check-err',e)}
}
function doReload(){location.href=location.pathname+'?_v='+Date.now()}
function showUpdateBanner(){
  if($('updateBanner'))return;
  const d=document.createElement('div');
  d.id='updateBanner';
  d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:999;background:#caa45a;color:#111;padding:12px 16px;text-align:center;font-weight:700;font-size:14px';
  d.textContent='🔄 יש גרסה חדשה — תיטען אוטומטית ברגע שתסגרו את החלון';
  document.body.appendChild(d);
}
setTimeout(checkForUpdate,2000);
setInterval(checkForUpdate,2*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
window.addEventListener('pageshow',checkForUpdate);
window.addEventListener('focus',checkForUpdate);
let lastTapCheck=0;
document.addEventListener('touchstart',()=>{
  const now=Date.now();
  if(now-lastTapCheck>60000){lastTapCheck=now;checkForUpdate()}
},{capture:true,passive:true});

/* ══════════ Init ══════════ */
renderDays();
renderView({enter:true});
initShared();
window.addEventListener('resize',layout);
fetchRates();
fetchWeather();
setTimeout(ensureDevice,400);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
setTimeout(()=>{if(!synced){synced=true;renderView()}},3500);
</script>
